services:
  postgres:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roadtrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roadtrace}
      POSTGRES_DB: ${POSTGRES_DB:-roadtrace}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - postgres

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.workers.inference_worker"]
    env_file: .env
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  osrm-backend:
    image: osrm/osrm-backend:latest
    container_name: roadtrace-osrm
    restart: unless-stopped
    ports:
      - "5000:5000"
    command: osrm-routed --algorithm mld /data/southern-zone-latest.osrm
    volumes:
      - osrm-data:/data

volumes:
  pgdata:
  osrm-data:
